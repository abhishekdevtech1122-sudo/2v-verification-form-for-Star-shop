<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मर्चेंट रजिस्ट्रेशन फॉर्म | Star Shop</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #111111;
            --card-bg: #ffffff;
            --border-color: #d1d5db;
            --input-bg: #ffffff;
            --input-text: #111111;
            --btn-bg: #111111;
            --btn-text: #ffffff;
            --accent-gray: #666666;
            --badge-bg: #111111;
            --badge-text: #ffffff;
            --success-color: #059669;
        }

        [data-theme="dark"] {
            --bg-color: #0b0b0f;
            --text-color: #f3f4f6;
            --card-bg: #16161a;
            --border-color: #27272a;
            --input-bg: #1f1f23;
            --input-text: #f3f4f6;
            --btn-bg: #f3f4f6;
            --btn-text: #0b0b0f;
            --accent-gray: #9ca3af;
            --badge-bg: #d4af37;
            --badge-text: #0b0b0f;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .theme-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        .premium-badge {
            position: absolute;
            top: 0;
            right: 0;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-bottom-left-radius: 14px;
            box-shadow: -2px 2px 8px rgba(0,0,0,0.1);
        }

        .form-header {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 10px;
        }

        .form-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            cursor: pointer;
            user-select: none;
        }

        .form-header p {
            font-size: 0.85rem;
            color: var(--accent-gray);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--input-text);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--text-color);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .photo-upload-container {
            border: 2px dashed var(--border-color);
            background-color: var(--input-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s;
        }

        .photo-upload-container:hover {
            border-color: var(--text-color);
        }

        .photo-upload-input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        .upload-placeholder {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }

        .upload-placeholder svg {
            width: 32px; height: 32px; stroke: var(--accent-gray);
        }

        .upload-placeholder span {
            font-size: 0.85rem; font-weight: 600; color: var(--text-color);
        }

        .upload-placeholder small {
            font-size: 0.75rem; color: var(--accent-gray);
        }

        .photo-preview-box {
            display: none; width: 100%; align-items: center; gap: 12px;
        }

        .photo-preview-box img {
            width: 56px; height: 56px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color);
        }

        .photo-preview-info {
            text-align: left; flex: 1; overflow: hidden;
        }

        .photo-preview-info p {
            font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-color);
        }

        .photo-preview-info small {
            font-size: 0.75rem; color: var(--success-color);
        }

        .location-wrapper {
            display: flex; gap: 8px;
        }

        .location-btn {
            background-color: var(--border-color); color: var(--text-color); border: none; padding: 0 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; white-space: nowrap;
        }

        .submit-btn {
            width: 100%; padding: 13px; background-color: var(--btn-bg); color: var(--btn-text); border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 8px;
        }

        .footer-note {
            text-align: center; margin-top: 20px; font-size: 0.75rem; color: var(--accent-gray);
        }

        .custom-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
        }
        .custom-modal-overlay.active { opacity: 1; visibility: visible; }
        .custom-modal-box {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            width: 85%; max-width: 340px; padding: 24px; border-radius: 16px; text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .custom-modal-box h3 { font-size: 1.1rem; margin-bottom: 10px; font-weight: 700; color: var(--text-color); }
        .custom-modal-box p { font-size: 0.9rem; color: var(--accent-gray); margin-bottom: 20px; line-height: 1.5; }
        .custom-modal-btn {
            background-color: var(--btn-bg); color: var(--btn-text); border: none;
            width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <div class="top-bar">
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">☀️ लाइट मोड</button>
        </div>

        <div class="form-card">
            <div class="premium-badge">VVIP PARTNER</div>

            <div class="form-header">
                <h1>मर्चेंट रजिस्ट्रेशन</h1>
                <p>Star Shop Partner Program</p>
            </div>

            <form id="merchantForm">
                <div class="form-group">
                    <label for="merchantId">मर्चेंट यूनिक आईडी (Store Username/ID)</label>
                    <input type="text" id="merchantId" placeholder="जैसे: aone_store या star123" required>
                </div>

                <div class="form-group">
                    <label for="name">दुकान का नाम (Store Name)</label>
                    <input type="text" id="name" placeholder="अपनी दुकान का नाम दर्ज करें" required>
                </div>

                <div class="form-group">
                    <label for="phone">फोन नंबर</label>
                    <input type="tel" id="phone" placeholder="10 अंकों का मोबाइल नंबर" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label for="category">दुकान की कैटेगरी (Store Category)</label>
                    <input type="text" id="category" list="categoryList" placeholder="अपनी कैटेगरी चुनें या खुद टाइप करें..." required>
                    <datalist id="categoryList">
                        <option value="Kirana & Grocery">
                        <option value="Salon & Beauty">
                        <option value="Clothing & Fashion">
                        <option value="Cafe & Food">
                        <option value="Electronics">
                        <option value="Hardware Store">
                        <option value="Medical & Pharmacy">
                        <option value="Book Store">
                    </datalist>
                </div>

                <div class="form-group">
                    <label>दुकान की फोटो (Store Photo)</label>
                    <div class="photo-upload-container" id="uploadBox">
                        <input type="file" id="storeImageFile" class="photo-upload-input" accept="image/*" onchange="previewSelectedImage(event)">
                        
                        <div class="upload-placeholder" id="uploadPlaceholder">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
                            </svg>
                            <span>गैलरी से फोटो चुनें</span>
                            <small>यहाँ टैप करें या फोटो खींचकर अपलोड करें</small>
                        </div>

                        <div class="photo-preview-box" id="photoPreviewBox">
                            <img id="previewImg" src="" alt="Preview">
                            <div class="photo-preview-info">
                                <p id="fileNameText">photo.jpg</p>
                                <small>✓ फोटो चुनी गई (क्लिक करके बदलें)</small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">व्यापार का एड्रेस</label>
                    <textarea id="address" placeholder="दुकान या ऑफिस का पूरा पता लिखें..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="location">GPS लोकेशन</label>
                    <div class="location-wrapper">
                        <input type="text" id="location" placeholder="लोकेशन दर्ज करें या GPS बटन दबाएं..." required>
                        <button type="button" class="location-btn" onclick="getGPSLocation()">लोकेशन लें</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">दुकान लाइव करें 🚀</button>
            </form>
        </div>

        <div class="footer-note">
            © 2026 Kaito Tech & Star Shop. All Rights Reserved.
        </div>
    </div>

    <!-- मोडल -->
    <div class="custom-modal-overlay" id="customModal">
        <div class="custom-modal-box">
            <h3 id="modalTitle">सूचना</h3>
            <p id="modalMessage">यहाँ संदेश दिखाई देगा...</p>
            <button class="custom-modal-btn" onclick="closeModal()">ठीक है (OK)</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://gejrzpflcuvlbpedliwq.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_dw9J2AX0nd3SxPrRy9JGCg_YqS8ZfUF";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggleBtn');
            const currentTheme = body.getAttribute('data-theme');
            
            if (currentTheme === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '🌙 डार्क मोड';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ लाइट मोड';
            }
        }

        function previewSelectedImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('fileNameText').textContent = file.name;
                    document.getElementById('uploadPlaceholder').style.display = 'none';
                    document.getElementById('photoPreviewBox').style.display = 'flex';
                }
                reader.readAsDataURL(file);
            }
        }

        function getGPSLocation() {
            const locationInput = document.getElementById('location');
            if (navigator.geolocation) {
                locationInput.value = "लोकेशन प्राप्त हो रही है...";
                navigator.geolocation.getCurrentPosition((pos) => {
                    locationInput.value = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                }, () => {
                    showModal("लोकेशन एरर", "GPS लोकेशन नहीं मिल पाई। कृपया मैन्युअली दर्ज करें।");
                    locationInput.value = "";
                }, { enableHighAccuracy: true });
            } else {
                showModal("सपोर्ट नहीं है", "आपका ब्राउज़र जियोलोकेशन सपोर्ट नहीं करता।");
            }
        }

        function showModal(title, msg) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('customModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        document.getElementById('merchantForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = "डेटा सेव हो रहा है...";
            submitBtn.disabled = true;

            const merchantId = document.getElementById('merchantId').value.trim();
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const category = document.getElementById('category').value.trim();
            const address = document.getElementById('address').value.trim();
            const location = document.getElementById('location').value.trim();
            const imageFileInput = document.getElementById('storeImageFile');

            let assignedImageUrl = "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=80";

            try {
                if (imageFileInput.files && imageFileInput.files[0]) {
                    const file = imageFileInput.files[0];
                    const filePath = `merchants/${merchantId}_${Date.now()}.${file.name.split('.').pop()}`;
                    
                    const { error: uploadError } = await supabaseClient.storage
                        .from('store-images')
                        .upload(filePath, file);

                    if (uploadError) throw uploadError;

                    const { data: pubData } = supabaseClient.storage
                        .from('store-images')
                        .getPublicUrl(filePath);

                    if (pubData && pubData.publicUrl) {
                        assignedImageUrl = pubData.publicUrl;
                    }
                }

                const { error: dbError } = await supabaseClient
                    .from('merchants')
                    .upsert([{
                        id: merchantId,
                        phone: phone,
                        store_name: name,
                        category: category,
                        address: address,
                        location: location,
                        image_url: assignedImageUrl,
                        status: 'approved'
                    }]);

                if (dbError) throw dbError;

                showModal("सफलता!", "दुकान सफलतापूर्वक रजिस्टर हो गई है। अब WhatsApp पर रीडायरेक्ट किया जा रहा है...");
                setTimeout(() => {
                    const waText = `नमस्ते, मैंने Star Shop पर अपनी दुकान रजिस्टर कर दी है:\n\nदुकान: ${name}\nआईडी: ${merchantId}\nफोन: ${phone}\nपता: ${address}`;
                    window.location.href = `https://wa.me/919870242077?text=${encodeURIComponent(waText)}`;
                }, 1500);

            } catch (err) {
                showModal("रजिस्ट्रेशन एरर", err.message);
                submitBtn.textContent = "दुकान लाइव करें 🚀";
                submitBtn.disabled = false;
            }
        });
        <script>
  window.addEventListener('DOMContentLoaded', (event) => {
    const params = new URLSearchParams(window.location.search);

    if(params.get('name')) {
      document.querySelector('input[name="shop_name"]').value = params.get('name');
    }
    if(params.get('category')) {
      document.querySelector('input[name="category"]').value = params.get('category');
    }
    if(params.get('address')) {
      document.querySelector('input[name="address"]').value = params.get('address');
    }
    if(params.get('coords')) {
      document.querySelector('input[name="coords"]').value = params.get('coords');
    }
  });
</script>
    
    </script>
</body>
</html>
