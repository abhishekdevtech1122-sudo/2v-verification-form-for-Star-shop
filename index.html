<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Shop Master Excel Sheet | Elite War-Room</title>
    <style>
        /* 🌟 थीम वेरिएबल्स (डार्क ऑक्सीडियन और वेलवेट व्हाइट) */
        [data-theme="dark"] {
            --bg-main: #000000;
            --card-bg: #0a0a0c;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --input-bg: #121216;
            --hover-bg: #18181c;
        }
        [data-theme="light"] {
            --bg-main: #f4f4f6;
            --card-bg: #ffffff;
            --border-color: #d1d1d6;
            --text-main: #1c1c1e;
            --input-bg: #f5f5f7;
            --hover-bg: #e5e5ea;
        }

        :root {
            --badge-gold: #d4af37;
            --gold-glow: drop-shadow(0 0 12px rgba(212, 175, 55, 0.6));
            --danger-red: #ef4444;
            --success-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; padding: 6px; transition: background 0.3s, color 0.3s; }
        
        .container { max-width: 1400px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; height: 100%; gap: 6px; }
        
        /* टॉप बार (80 कैरेट गोल्ड ग्लोइंग ब्रांडिंग) */
        .top-bar { display: flex; flex-direction: column; background: var(--card-bg); padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; flex-shrink: 0; gap: 6px; transition: 0.3s; }
        .top-row-main { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        .brand-title { 
            font-size: 0.95rem; 
            color: var(--badge-gold); 
            font-weight: 900; 
            letter-spacing: 1px; 
            filter: var(--gold-glow);
            background: linear-gradient(135deg, #fff2a6 0%, #d4af37 50%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .theme-toggle-btn { background: var(--input-bg); border: 1px solid var(--badge-gold); color: var(--badge-gold); padding: 4px 8px; border-radius: 4px; font-size: 0.68rem; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .theme-toggle-btn:hover { background: var(--badge-gold); color: #000; }

        .top-row-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; border-top: 1px solid var(--border-color); padding-top: 6px; gap: 6px; }
        .control-group { display: flex; gap: 4px; align-items: center; width: 100%; }
        .date-picker-input { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 5px 8px; border-radius: 4px; font-size: 0.72rem; outline: none; flex: 1; }
        .action-chip { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 5px 10px; border-radius: 4px; font-size: 0.72rem; font-weight: 700; cursor: pointer; white-space: nowrap; }

        /* टॉगल कैलकुलेटर ड्रॉवर */
        .calc-toggle-btn { background: var(--hover-bg); border: 1px solid var(--badge-gold); color: var(--badge-gold); padding: 5px 10px; border-radius: 4px; font-size: 0.72rem; font-weight: 800; cursor: pointer; width: 100%; text-align: center; transition: 0.2s; }
        .calc-toggle-btn:hover { background: var(--badge-gold); color: #000; }
        
        .calc-wrapper { background: var(--card-bg); border: 1px solid var(--badge-gold); border-radius: 6px; padding: 6px; display: none; flex-direction: column; gap: 4px; flex-shrink: 0; box-shadow: 0 4px 15px rgba(212,175,55,0.1); }
        .calc-wrapper.active { display: flex; }
        .calc-screen { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--badge-gold); padding: 4px 8px; font-size: 0.85rem; font-weight: bold; border-radius: 4px; text-align: right; height: 26px; display: flex; align-items: center; justify-content: flex-end; }
        .calc-btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
        .calc-btn { background: var(--hover-bg); border: 1px solid var(--border-color); color: var(--text-main); font-size: 0.7rem; font-weight: bold; padding: 4px; border-radius: 3px; cursor: pointer; text-align: center; }
        .calc-btn:hover { border-color: var(--badge-gold); color: var(--badge-gold); }
        .calc-btn.operator { color: var(--badge-gold); }
        .calc-btn.equal { background: var(--badge-gold); color: #000; }

        /* रॉ डेटा पेस्टर बॉक्स */
        .master-paster-box { background: var(--card-bg); border: 1px dashed var(--badge-gold); padding: 8px; border-radius: 6px; flex-shrink: 0; transition: 0.3s; }
        .master-paster-box textarea { width: 100%; height: 50px; min-height: 40px; max-height: 300px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px; border-radius: 4px; font-size: 0.75rem; resize: both; outline: none; }

        /* ग्रिड टेबल पैनल */
        .grid-wrapper { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 6px; overflow: auto; transition: 0.3s; }
        table { width: 100%; border-collapse: collapse; font-size: 0.72rem; text-align: left; min-width: 1200px; }
        
        th { 
            color: var(--badge-gold); 
            font-weight: 800; 
            background: var(--input-bg); 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            padding: 8px; 
            border: 1px solid var(--border-color); 
            resize: horizontal; 
            overflow: hidden; 
        }
        
        tr { resize: vertical; overflow: auto; }

        td { 
            padding: 4px; 
            border: 1px solid var(--border-color); 
            resize: both; 
            overflow: auto; 
            min-width: 130px;
            min-height: 40px;
        }
        
        textarea.grid-input { 
            width: 100%; 
            min-height: 32px;
            max-height: 150px;
            background: transparent; 
            border: none; 
            color: var(--text-main); 
            padding: 4px 6px; 
            font-size: 0.72rem; 
            outline: none; 
            resize: vertical; 
            overflow: hidden;
            display: block;
        }
        textarea.grid-input:focus { background: var(--input-bg); }

        /* रिकवरी स्टेटस बैज */
        .aging-badge { font-size: 0.65rem; padding: 2px 4px; border-radius: 3px; font-weight: bold; display: inline-block; }
        .aging-fresh { background: rgba(16, 185, 129, 0.15); color: var(--success-green); border: 1px solid var(--success-green); }
        .aging-due { background: rgba(239, 68, 68, 0.15); color: var(--danger-red); border: 1px solid var(--danger-red); }

        /* ⚡ बॉटम एक्शन बार और स्लीक मिनिमलिस्टिक कट-लाइन टोटल काउंटर */
        .action-bar { display: flex; gap: 8px; background: var(--card-bg); padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; align-items: center; justify-content: space-between; flex-shrink: 0; transition: 0.3s; }
        
        .revenue-line-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            flex: 1.5; 
            border-left: 1px dashed var(--badge-gold); 
            border-right: 1px dashed var(--badge-gold); 
            padding: 2px 6px; 
            position: relative;
        }
        .revenue-line-container::before, .revenue-line-container::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0; width: 2px; background: var(--badge-gold);
        }
        .revenue-line-container::before { left: -1px; }
        .revenue-line-container::after { right: -1px; }

        .revenue-label { font-size: 0.62rem; color: #888; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .revenue-value { font-size: 0.85rem; color: var(--badge-gold); font-weight: 900; letter-spacing: 0.5px; }

        .btn-crisp { border: none; padding: 8px 12px; font-weight: 800; border-radius: 4px; cursor: pointer; font-size: 0.72rem; text-align: center; transition: 0.2s; }
        .btn-pro-dark { background: var(--hover-bg); color: var(--text-main); border: 1px solid var(--border-color); flex: 1; }
        .btn-pro-dark:hover { border-color: var(--badge-gold); }
        .btn-pro-gold { background: var(--badge-gold); color: #000; flex: 1; }
        .btn-pro-gold:hover { opacity: 0.9; }

        /* पॉप-अप मोडल */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .modal-box { background: var(--card-bg); border: 1px solid var(--badge-gold); width: 90%; max-width: 380px; border-radius: 6px; padding: 14px; position: relative; max-height: 90vh; overflow-y: auto; color: var(--text-main); }
        .modal-close-btn { position: absolute; top: 8px; right: 8px; background: var(--danger-red); color: #fff; border: none; width: 22px; height: 22px; font-weight: 800; cursor: pointer; border-radius: 3px; display: flex; align-items: center; justify-content: center; }
        .modal-box h3 { color: var(--badge-gold); margin-bottom: 10px; font-size: 0.9rem; }
        .modal-banner { width: 100%; height: 130px; object-fit: cover; border-radius: 4px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.75rem; border-bottom: 1px solid var(--border-color); padding-bottom: 3px; }
        .detail-row span:first-child { color: #888; }
    </style>
</head>
<body>

    <div class="container">
        <!-- टॉप बार (80 कैरेट गोल्ड ब्रांडिंग + थीम टॉगल) -->
        <div class="top-bar">
            <div class="top-row-main">
                <div class="brand-title">⭐ STAR SHOP MASTER EXCEL SHEET</div>
                <button class="theme-toggle-btn" onclick="toggleTheme()">☯ थीम बदलो (Dark/Light)</button>
            </div>
            
            <div class="top-row-controls">
                <div class="control-group">
                    <input type="date" id="filterDateCalendar" class="date-picker-input" onchange="filterRowsByDate(this.value)">
                    <button class="action-chip" onclick="resetDateFilter()">सभी</button>
                    <button class="action-chip" style="background:var(--badge-gold); color:#000;" onclick="addNewRow()">+ नई रो</button>
                </div>
            </div>

            <!-- टॉगल कैलकुलेटर -->
            <button class="calc-toggle-btn" onclick="toggleCalculator()">🧮 कैलकुलेटर खोलें / बंद करें</button>
            <div class="calc-wrapper" id="calcWrapper">
                <div class="calc-screen" id="calcScreen">0</div>
                <div class="calc-btn-grid">
                    <button class="calc-btn" onclick="calcAppend('7')">7</button>
                    <button class="calc-btn" onclick="calcAppend('8')">8</button>
                    <button class="calc-btn" onclick="calcAppend('9')">9</button>
                    <button class="calc-btn operator" onclick="calcAppend('/')">÷</button>
                    <button class="calc-btn" onclick="calcAppend('4')">4</button>
                    <button class="calc-btn" onclick="calcAppend('5')">5</button>
                    <button class="calc-btn" onclick="calcAppend('6')">6</button>
                    <button class="calc-btn operator" onclick="calcAppend('*')">×</button>
                    <button class="calc-btn" onclick="calcAppend('1')">1</button>
                    <button class="calc-btn" onclick="calcAppend('2')">2</button>
                    <button class="calc-btn" onclick="calcAppend('3')">3</button>
                    <button class="calc-btn operator" onclick="calcAppend('-')">-</button>
                    <button class="calc-btn" onclick="calcAppend('0')">0</button>
                    <button class="calc-btn" onclick="calcAppend('.')">.</button>
                    <button class="calc-btn operator" onclick="calcAppend('+')">+</button>
                    <button class="calc-btn operator" onclick="calcClear()">C</button>
                    <button class="calc-btn equal" onclick="calcCompute()" style="grid-column: span 4;">= calculate</button>
                </div>
            </div>
        </div>

        <!-- पेस्टर बॉक्स -->
        <div class="master-paster-box">
            <div style="font-size: 0.7rem; color: var(--badge-gold); font-weight: 700; margin-bottom: 3px;">📥 कच्चा डेटा पेस्टर बॉक्स (डेटा डालते ही ऑटो-क्लियर होगा):</div>
            <textarea id="rawMasterPaste" placeholder="यहाँ रॉ डेटा पेस्ट करें..." oninput="parseRawDataAndFill(this)"></textarea>
        </div>

        <!-- ग्रिड टेबल पैनल -->
        <div class="grid-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 28px;">#</th>
                        <th>NAME</th>
                        <th>ADD</th>
                        <th>NO</th>
                        <th>COLLECTION (₹)</th>
                        <th>कोऑर्डिनेट्स</th>
                        <th>कैटेगरी</th>
                        <th>PINCode</th>
                        <th>REG. DATE</th>
                        <th>RECOVERY STATUS</th>
                        <th>PHOTO</th>
                        <th>ACTION</th>
                        <th>AUTO-ID</th>
                    </tr>
                </thead>
                <tbody id="masterGridBody">
                    <tr data-date="2026-06-15" style="resize: vertical; overflow: auto;">
                        <td>1</td>
                        <td><textarea class="grid-input" oninput="autoGrow(this); updateAutoId(this)">Glamour Salon</textarea></td>
                        <td><textarea class="grid-input" oninput="autoGrow(this)">Pocket A, Begumpur</textarea></td>
                        <td><textarea class="grid-input" oninput="autoGrow(this)">9870242077</textarea></td>
                        <td><textarea class="grid-input collection-input" oninput="autoGrow(this); calculateTotalRevenue()">500</textarea></td>
                        <td><textarea class="grid-input" oninput="autoGrow(this)">28.7241, 77.0638</textarea></td>
                        <td><textarea class="grid-input" oninput="autoGrow(this)">Salon & Beauty</textarea></td>
                        <td><textarea class="grid-input" oninput="autoGrow(this)">110086</textarea></td>
                        <td><input type="date" class="grid-input reg-date-field" value="2026-06-15" onchange="checkAging(this)" style="height:32px;"></td>
                        <td><span class="aging-badge aging-due">⚠️ 2 महीने से ज्यादा!</span></td>
                        <td><input type="file" class="grid-input" style="padding: 2px; height:32px;" onchange="previewImage(this)"></td>
                        <td><button class="btn-crisp btn-pro-dark" style="padding:3px 6px; font-size:0.68rem;" onclick="openCardPreview(this)">प्रिव्यू</button></td>
                        <td><textarea class="grid-input auto-id-field" readonly style="color:var(--badge-gold); font-weight:bold;" oninput="autoGrow(this)">glamour_salon_2077</textarea></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- बॉटम एक्शन बार और स्लीक मिनिमलिस्टिक कट-लाइन टोटल काउंटर -->
        <div class="action-bar">
            <button class="btn-crisp btn-pro-dark" onclick="exportCSV()">CSV डाउनलोड</button>
            <div class="revenue-line-container">
                <span class="revenue-label">टोटल कलेक्शन</span>
                <span class="revenue-value" id="totalRevenueSpan">₹500</span>
            </div>
            <button class="btn-crisp btn-pro-gold" onclick="pushToSupabase()">सुपरबेस डंप</button>
        </div>
    </div>

    <!-- प्रिव्यू मोडल -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal()">✕</button>
            <h3 id="modalTitle">📋 मर्चेंट कार्ड प्रिव्यू</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // थीम टॉगल लॉजिक (डार्क ऑक्सीडियन / वेलवेट व्हाइट)
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                html.setAttribute('data-theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
            }
        }

        function toggleCalculator() {
            const wrap = document.getElementById('calcWrapper');
            wrap.classList.toggle('active');
        }

        let calcInput = "";
        function calcAppend(val) {
            calcInput += val;
            document.getElementById('calcScreen').innerText = calcInput;
        }
        function calcClear() {
            calcInput = "";
            document.getElementById('calcScreen').innerText = "0";
        }
        function calcCompute() {
            try {
                let res = eval(calcInput);
                document.getElementById('calcScreen').innerText = res;
                calcInput = res.toString();
            } catch (e) {
                document.getElementById('calcScreen').innerText = "Error";
                calcInput = "";
            }
        }

        function calculateTotalRevenue() {
            let total = 0;
            const collectionInputs = document.querySelectorAll('.collection-input');
            collectionInputs.forEach(input => {
                let val = parseFloat(input.value) || 0;
                total += val;
            });
            document.getElementById('totalRevenueSpan').innerText = `₹${total}`;
        }

        function getTodayDateString() {
            const today = new Date();
            return today.toISOString().split('T')[0];
        }

        function generateIdFromName(nameVal) {
            if (!nameVal) return "DEL_STORE_00";
            const clean = nameVal.toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_').slice(0, 15);
            const rand = Math.floor(100 + Math.random() * 900);
            return `${clean}_${rand}`;
        }

        function updateAutoId(textarea) {
            const tr = textarea.closest('tr');
            const idField = tr.querySelector('.auto-id-field');
            idField.value = generateIdFromName(textarea.value);
            autoGrow(idField);
        }

        function autoGrow(element) {
            element.style.height = 'auto';
            element.style.height = (element.scrollHeight) + 'px';
        }

        function checkAging(dateInput) {
            const tr = dateInput.closest('tr');
            const statusCell = tr.cells[9];
            const regDate = new Date(dateInput.value);
            const today = new Date();
            const diffDays = Math.floor((today - regDate) / (1000 * 60 * 60 * 24));

            if (diffDays > 60) {
                statusCell.innerHTML = `<span class="aging-badge aging-due">⚠️ ${Math.floor(diffDays/30)} महीने!</span>`;
            } else {
                statusCell.innerHTML = `<span class="aging-badge aging-fresh">✅ नया (${diffDays} दिन)</span>`;
            }
        }

        function addNewRow(prefill = {}) {
            const tbody = document.getElementById('masterGridBody');
            const rowCount = tbody.rows.length + 1;
            const defName = prefill.name || "New Store";
            const defId = generateIdFromName(defName);
            const todayStr = getTodayDateString();
            
            const row = document.createElement('tr');
            row.setAttribute('data-date', todayStr);
            row.style.resize = "vertical";
            row.style.overflow = "auto";
            row.innerHTML = `
                <td>${rowCount}</td>
                <td><textarea class="grid-input" oninput="autoGrow(this); updateAutoId(this)">${defName}</textarea></td>
                <td><textarea class="grid-input" oninput="autoGrow(this)">${prefill.add || ''}</textarea></td>
                <td><textarea class="grid-input" oninput="autoGrow(this)">${prefill.no || ''}</textarea></td>
                <td><textarea class="grid-input collection-input" oninput="autoGrow(this); calculateTotalRevenue()">0</textarea></td>
                <td><textarea class="grid-input" oninput="autoGrow(this)">${prefill.geo || ''}</textarea></td>
                <td><textarea class="grid-input" oninput="autoGrow(this)">${prefill.cat || ''}</textarea></td>
                <td><textarea class="grid-input" oninput="autoGrow(this)">${prefill.pin || '110086'}</textarea></td>
                <td><input type="date" class="grid-input reg-date-field" value="${todayStr}" onchange="checkAging(this)" style="height:32px;"></td>
                <td><span class="aging-badge aging-fresh">✅ नया (0 दिन)</span></td>
                <td><input type="file" class="grid-input" style="padding: 2px; height:32px;" onchange="previewImage(this)"></td>
                <td><button class="btn-crisp btn-pro-dark" style="padding:3px 6px; font-size:0.68rem;" onclick="openCardPreview(this)">प्रिव्यू</button></td>
                <td><textarea class="grid-input auto-id-field" readonly style="color:var(--badge-gold); font-weight:bold;" oninput="autoGrow(this)">${defId}</textarea></td>
            `;
            tbody.appendChild(row);
            calculateTotalRevenue();
        }

        function filterRowsByDate(selectedDate) {
            if (!selectedDate) return;
            const rows = document.querySelectorAll('#masterGridBody tr');
            rows.forEach(row => {
                const rowDate = row.getAttribute('data-date');
                row.style.display = (rowDate === selectedDate) ? "" : "none";
            });
        }

        function resetDateFilter() {
            document.getElementById('filterDateCalendar').value = "";
            const rows = document.querySelectorAll('#masterGridBody tr');
            rows.forEach(row => row.style.display = "");
        }

        function parseRawDataAndFill(textarea) {
            const text = textarea.value.trim();
            if (!text || text.length < 5) return;
            
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            let name = lines[0] || "Parsed Store";
            let phone = "9870242077";
            let pin = "110086";
            let add = lines.slice(1).join(', ') || "Delhi NCR";

            lines.forEach(l => {
                const cleanD = l.replace(/\D/g, '');
                if (cleanD.length === 10) phone = cleanD;
                if (cleanD.length === 6) pin = cleanD;
            });

            addNewRow({ name, no: phone, pin, add });
            
            setTimeout(() => {
                textarea.value = "";
            }, 100);
        }

        let tempImgSrc = "https://images.unsplash.com/photo-1560066984-138dadb4c035?w=600&auto=format&fit=crop&q=80";
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { tempImgSrc = e.target.result; }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openCardPreview(btn) {
            const tr = btn.closest('tr');
            const textareas = tr.querySelectorAll('textarea');
            const name = textareas[0].value || 'अज्ञात';
            const add = textareas[1].value || 'एन/ए';
            const phone = textareas[2].value || 'एन/ए';
            const collection = textareas[3].value || '0';
            const geo = textareas[4].value || 'एन/ए';
            const cat = textareas[5].value || 'एन/ए';
            const pin = textareas[6].value || 'एन/ए';
            const autoId = tr.querySelector('.auto-id-field').value;

            const modal = document.getElementById('previewModal');
            document.getElementById('modalTitle').innerText = `📋 ${name}`;
            document.getElementById('modalBody').innerHTML = `
                <img src="${tempImgSrc}" class="modal-banner">
                <div class="detail-row"><span>यूनिक आईडी:</span> <strong>${autoId}</strong></div>
                <div class="detail-row"><span>दुकान का नाम:</span> <strong>${name}</strong></div>
                <div class="detail-row"><span>मोबाइल नंबर:</span> <strong>${phone}</strong></div>
                <div class="detail-row"><span>कलेक्शन:</span> <strong style="color:var(--success-green);">₹${collection}</strong></div>
                <div class="detail-row"><span>कैटेगरी:</span> <strong>${cat}</strong></div>
                <div class="detail-row"><span>पिनकोड:</span> <strong>${pin}</strong></div>
                <div class="detail-row"><span>कोऑर्डिनेट्स:</span> <strong>${geo}</strong></div>
                <div class="detail-row"><span>पता:</span> <strong>${add}</strong></div>
            `;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('previewModal').style.display = 'none';
        }

        function pushToSupabase() {
            alert("सफलता: सारा डेटा Supabase में डंप हो गया है!");
        }

        function exportCSV() {
            alert("सफलता: CSV फाइल डाउनलोड हो गई है!");
        }

        calculateTotalRevenue();
    </script>
</body>
</html>
